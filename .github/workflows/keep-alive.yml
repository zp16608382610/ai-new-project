# Render 免费(Free)Web Service 在约 15 分钟无入站请求后会自动休眠。
# 本工作流每 10 分钟 ping 一次后端直连 URL,避免用户提问时撞上后端冷启动。
# 手动触发:仓库 Actions 页 → “Render keep-alive” → Run workflow。
name: Render keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping Render services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend health endpoint
        continue-on-error: true
        run: |
          curl -sS -m 60 -L -o /dev/null -w "backend /api/v1/health -> HTTP %{http_code} (%{time_total}s)\n" \
            https://ai-new-project-pavw.onrender.com/api/v1/health || true